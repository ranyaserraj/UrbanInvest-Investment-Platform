apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbaninvest-app
  namespace: urbaninvest
  labels:
    app: urbaninvest-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urbaninvest-app
  template:
    metadata:
      labels:
        app: urbaninvest-app
    spec:
      containers:
      - name: urbaninvest-app
        image: urbaninvest/urbaninvest-platform:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: urbaninvest-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: urbaninvest-service
  namespace: urbaninvest
  labels:
    app: urbaninvest-app
spec:
  selector:
    app: urbaninvest-app
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urbaninvest-ingress
  namespace: urbaninvest
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: urbaninvest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: urbaninvest-service
            port:
              number: 8080
