apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbaninvest-app
  labels:
    app: urbaninvest-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urbaninvest-app
  template:
    metadata:
      labels:
        app: urbaninvest-app
    spec:
      containers:
      - name: urbaninvest-app
        image: urbaninvest/urbaninvest-platform:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "mysql-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "urbaninvest"
        - name: DB_USER
          value: "urbaninvest"
        - name: DB_PASSWORD
          value: "urbaninvest123"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
