kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: urbaninvest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: urbaninvest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi