apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: urbaninvest
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'urbaninvest-app'
        static_configs:
          - targets: ['urbaninvest-service:8080']
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s

      - job_name: 'mysql'
        static_configs:
          - targets: ['mysql-service:3306']
        scrape_interval: 30s

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
